name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run pytest
        run: pytest -v

      - name: Test CLI invocation
        run: |
          mpreflight --help

  action-test:
    name: Test Composite Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create sample manuscript
        run: |
          mkdir -p sample
          cat << 'EOF' > sample/paper.md
          # Pilot Study on Method Performance

          We measured an effect size of t(28) = 2.45, p = 0.021.
          Our cohort included N = 30 subjects (Mean = 4.25, SD = 0.85).
          EOF

      - name: Run manuscript-preflight-ci composite action
        uses: ./
        with:
          manuscript: sample/paper.md
          offline: "true"
          fail-on: "fail"

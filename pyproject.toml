[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manuscript-preflight-ci"
version = "0.1.0"
description = "Ephemeral pre-submission manuscript linter for retracted/broken DOIs, GRIM granularity, test-statistic p-values, and table-vs-prose sample-size (N) drift."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Manuscript Preflight CI Contributors" }]
keywords = [
  "reproducibility",
  "manuscript",
  "latex",
  "quarto",
  "retraction-watch",
  "crossref",
  "statcheck",
  "grim-test",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mpreflight = "manuscript_preflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
